limit_req_zone $binary_remote_addr zone=votekit_auth:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name votekit.org www.votekit.org;
    return 301 https://votekit.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votekit.org www.votekit.org;

    ssl_certificate /etc/letsencrypt/live/votekit.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votekit.org/privkey.pem;
    client_max_body_size 2m;

    location = /api/auth/verify {
        limit_req zone=votekit_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, rather than append, untrusted client input.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
